<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat & Messages</title>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/credits_style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="icon" type="image/svg+xml" href="/Frontend/Images/favicon.ico">
    <link rel="stylesheet" href="css/chat.css">
    <script src="js/chrome.js" defer></script>
</head>
<body>
    <div class="page-container">
        <a href="/Frontend/index.html" class="back-button">
            ← Back to Control
        </a>

        <!-- Private Messages Section -->
        <div class="section-header">
            <h2>✉️ Private Messages</h2>
            <p>Send a private notification to another user</p>
        </div>

        <div class="pm-form">
            <label for="pmRecipient">Recipient</label>
            <div class="pm-autocomplete">
                <input type="text" id="pmRecipient" placeholder="Type at least 3 characters..." autocomplete="off">
                <div class="pm-suggestions" id="pmSuggestions"></div>
            </div>

            <label for="pmText">Message</label>
            <textarea id="pmText" placeholder="Type your private message..." maxlength="500"></textarea>

            <button class="pm-send-button" id="pmSendButton">Send Private Message</button>

            <div class="pm-status" id="pmStatus"></div>
        </div>

        <div class="pm-info">
            Private messages appear as notifications to the recipient the next time they use the app.
        </div>

        <hr class="section-divider">

        <!-- Public Chat Section -->
        <div class="section-header">
            <h2>💬 Public Chat</h2>
            <p>Chat with other curtain controllers</p>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="empty-state">Loading messages...</div>
        </div>

        <div class="chat-input-container">
            <input 
                type="text" 
                class="chat-input" 
                id="messageInput" 
                placeholder="Type your message..."
                maxlength="500"
            >
            <button class="send-button" id="sendButton">Send</button>
        </div>
    </div>

    <script>
        let lastMessageCount = 0;

        // ============== Public Chat ==============
        async function loadMessages() {
            try {
                const response = await fetch('/api/chat/messages', {
                    credentials: 'include'
                });

                if (!response.ok) throw new Error('Failed to load messages');

                const data = await response.json();
                const messagesContainer = document.getElementById('chatMessages');

                if (data.messages.length === 0) {
                    messagesContainer.innerHTML = '<div class="empty-state">No messages yet. Be the first to say something!</div>';
                    return;
                }

                if (data.messages.length !== lastMessageCount) {
                    lastMessageCount = data.messages.length;
                    
                    messagesContainer.innerHTML = data.messages.map(msg => {
                        const messageTime = new Date(msg.timestamp).toLocaleTimeString([], { 
                            hour: '2-digit', 
                            minute: '2-digit' 
                        });

                        const premiumClass = msg.is_premium ? 'premium' : '';
                        const crownIcon = msg.is_premium ? '<span class="crown-icon">👑</span>' : '';

                        return `
                            <div class="message ${premiumClass}">
                                <div class="message-header">
                                    ${crownIcon}
                                    <span class="message-username">${escapeHtml(msg.username)}</span>
                                    <span class="message-time">${messageTime}</span>
                                </div>
                                <div class="message-text">${escapeHtml(msg.message)}</div>
                            </div>
                        `;
                    }).join('');

                    messagesContainer.scrollTop = messagesContainer.scrollHeight;
                }
            } catch (error) {
                console.error('Error loading messages:', error);
            }
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();

            if (!message) return;

            const sendButton = document.getElementById('sendButton');
            sendButton.disabled = true;

            try {
                const response = await fetch('/api/chat/send', {
                    method: 'POST',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });

                if (!response.ok) throw new Error('Failed to send message');

                input.value = '';
                await loadMessages();
            } catch (error) {
                console.error('Error sending message:', error);
                alert('Failed to send message. Please try again.');
            } finally {
                sendButton.disabled = false;
                input.focus();
            }
        }

        // ============== Private Messages ==============
        let searchTimeout = null;

        document.getElementById('pmRecipient').addEventListener('input', function() {
            const query = this.value.trim();
            const suggestionsEl = document.getElementById('pmSuggestions');

            if (query.length < 3) {
                suggestionsEl.style.display = 'none';
                return;
            }

            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(async () => {
                try {
                    const response = await fetch(`/api/users/search?q=${encodeURIComponent(query)}`, {
                        credentials: 'include'
                    });
                    if (!response.ok) throw new Error('Search failed');
                    const data = await response.json();

                    if (data.users.length === 0) {
                        suggestionsEl.innerHTML = '<div class="pm-suggestion-item" style="color:#9ca3af;cursor:default;">No users found</div>';
                    } else {
                        suggestionsEl.innerHTML = data.users.map(u =>
                            `<div class="pm-suggestion-item" onclick="selectRecipient('${escapeHtml(u)}')">${escapeHtml(u)}</div>`
                        ).join('');
                    }
                    suggestionsEl.style.display = 'block';
                } catch (error) {
                    console.error('Error searching users:', error);
                    suggestionsEl.style.display = 'none';
                }
            }, 300);
        });

        function selectRecipient(username) {
            document.getElementById('pmRecipient').value = username;
            document.getElementById('pmSuggestions').style.display = 'none';
        }

        // Hide suggestions on click outside
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.pm-autocomplete')) {
                document.getElementById('pmSuggestions').style.display = 'none';
            }
        });

        async function sendPrivateMessage() {
            const recipient = document.getElementById('pmRecipient').value;
            const text = document.getElementById('pmText').value.trim();
            const statusEl = document.getElementById('pmStatus');
            const sendBtn = document.getElementById('pmSendButton');

            statusEl.className = 'pm-status';
            statusEl.style.display = 'none';

            if (!recipient) {
                statusEl.textContent = 'Please enter a recipient username.';
                statusEl.className = 'pm-status error';
                return;
            }
            if (!text) {
                statusEl.textContent = 'Please enter a message.';
                statusEl.className = 'pm-status error';
                return;
            }

            sendBtn.disabled = true;

            try {
                const response = await fetch('/api/messages/send', {
                    method: 'POST',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: recipient, text: text })
                });

                const data = await response.json();

                if (!response.ok) throw new Error(data.detail || 'Failed to send message');

                statusEl.textContent = `Message sent to ${recipient}!`;
                statusEl.className = 'pm-status success';
                document.getElementById('pmText').value = '';
            } catch (error) {
                statusEl.textContent = error.message;
                statusEl.className = 'pm-status error';
            } finally {
                sendBtn.disabled = false;
            }
        }

        // ============== Utilities ==============
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ============== Event Listeners ==============
        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
        document.getElementById('sendButton').addEventListener('click', sendMessage);
        document.getElementById('pmSendButton').addEventListener('click', sendPrivateMessage);

        // Load on page load
        loadMessages();
        setInterval(loadMessages, 3000);
    </script>
</body>
</html>
