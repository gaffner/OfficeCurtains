<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat & Messages</title>
    <link rel="stylesheet" href="css/credits_style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="icon" type="image/svg+xml" href="Images/favicon.ico">
    <style>
        .page-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem;
        }

        .section-header {
            text-align: center;
            margin-bottom: 1rem;
        }

        .section-header h2 {
            color: #2563eb;
            font-size: 1.5rem;
            margin-bottom: 0.25rem;
        }

        .section-header p {
            color: #6b7280;
            font-size: 0.9rem;
        }

        .dark-mode .section-header h2 {
            color: #60a5fa;
        }

        .dark-mode .section-header p {
            color: #9ca3af;
        }

        /* Public Chat */
        .chat-messages {
            background: var(--card-bg, #ffffff);
            border-radius: 1rem;
            padding: 1.5rem;
            margin-bottom: 1rem;
            overflow-y: auto;
            max-height: 400px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .dark-mode .chat-messages {
            background: #1f2937;
        }

        .message {
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            background: #f3f4f6;
            border-left: 3px solid #d1d5db;
        }

        .dark-mode .message {
            background: #374151;
            border-left-color: #4b5563;
        }

        .message-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .message-username {
            font-weight: 600;
            font-size: 0.875rem;
        }

        .message-time {
            font-size: 0.75rem;
            color: #9ca3af;
        }

        .message-text {
            color: #374151;
            line-height: 1.5;
        }

        .dark-mode .message-text {
            color: #d1d5db;
        }

        .message.premium {
            border-left-color: #10b981;
            background: linear-gradient(to right, #d1fae5 0%, #f3f4f6 10%);
        }

        .dark-mode .message.premium {
            background: linear-gradient(to right, #065f46 0%, #374151 10%);
        }

        .message.premium .message-text {
            color: #059669;
            font-weight: 500;
        }

        .dark-mode .message.premium .message-text {
            color: #34d399;
        }

        .message.premium .message-username {
            color: #059669;
        }

        .dark-mode .message.premium .message-username {
            color: #34d399;
        }

        .crown-icon {
            color: #f59e0b;
            font-size: 1rem;
        }

        .chat-input-container {
            background: var(--card-bg, #ffffff);
            border-radius: 1rem;
            padding: 1rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            gap: 0.75rem;
        }

        .dark-mode .chat-input-container {
            background: #1f2937;
        }

        .chat-input {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 2px solid #e5e7eb;
            border-radius: 0.5rem;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .dark-mode .chat-input {
            background: #374151;
            border-color: #4b5563;
            color: white;
        }

        .chat-input:focus {
            outline: none;
            border-color: #2563eb;
        }

        .dark-mode .chat-input:focus {
            border-color: #60a5fa;
        }

        .send-button {
            padding: 0.75rem 2rem;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .send-button:hover {
            background: #1d4ed8;
        }

        .send-button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .empty-state {
            text-align: center;
            color: #9ca3af;
            padding: 2rem;
            font-style: italic;
        }

        /* Divider */
        .section-divider {
            border: none;
            border-top: 2px solid #e5e7eb;
            margin: 2rem 0;
        }

        .dark-mode .section-divider {
            border-top-color: #374151;
        }

        /* Private Messages - compact */
        .pm-form {
            background: var(--card-bg, #ffffff);
            border-radius: 0.75rem;
            padding: 1rem 1.25rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .dark-mode .pm-form {
            background: #1f2937;
        }

        .pm-form label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.35rem;
            color: #374151;
            font-size: 0.85rem;
        }

        .dark-mode .pm-form label {
            color: #d1d5db;
        }

        .pm-form select,
        .pm-form textarea,
        .pm-form input[type="text"] {
            width: 100%;
            padding: 0.5rem 0.75rem;
            border: 2px solid #e5e7eb;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            margin-bottom: 0.75rem;
            transition: border-color 0.3s ease;
            font-family: inherit;
            box-sizing: border-box;
        }

        .dark-mode .pm-form select,
        .dark-mode .pm-form textarea,
        .dark-mode .pm-form input[type="text"] {
            background: #374151;
            border-color: #4b5563;
            color: white;
        }

        .pm-form select:focus,
        .pm-form textarea:focus,
        .pm-form input[type="text"]:focus {
            outline: none;
            border-color: #2563eb;
        }

        .dark-mode .pm-form select:focus,
        .dark-mode .pm-form textarea:focus,
        .dark-mode .pm-form input[type="text"]:focus {
            border-color: #60a5fa;
        }

        .pm-form textarea {
            resize: vertical;
            min-height: 60px;
            max-height: 120px;
        }

        .pm-autocomplete {
            position: relative;
        }

        .pm-suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--card-bg, #ffffff);
            border: 2px solid #e5e7eb;
            border-top: none;
            border-radius: 0 0 0.5rem 0.5rem;
            max-height: 150px;
            overflow-y: auto;
            z-index: 10;
            display: none;
            margin-top: -0.75rem;
            margin-bottom: 0.75rem;
        }

        .dark-mode .pm-suggestions {
            background: #374151;
            border-color: #4b5563;
        }

        .pm-suggestion-item {
            padding: 0.4rem 0.75rem;
            cursor: pointer;
            font-size: 0.85rem;
            color: #374151;
        }

        .dark-mode .pm-suggestion-item {
            color: #d1d5db;
        }

        .pm-suggestion-item:hover {
            background: #eff6ff;
        }

        .dark-mode .pm-suggestion-item:hover {
            background: #4b5563;
        }

        .pm-send-button {
            padding: 0.5rem 1.5rem;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
            width: 100%;
        }

        .pm-send-button:hover {
            background: #1d4ed8;
        }

        .pm-send-button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .pm-status {
            padding: 0.5rem 0.75rem;
            border-radius: 0.5rem;
            font-weight: 500;
            font-size: 0.85rem;
            display: none;
            margin-top: 0.5rem;
        }

        .pm-status.success {
            display: block;
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #10b981;
        }

        .dark-mode .pm-status.success {
            background: #064e3b;
            color: #34d399;
        }

        .pm-status.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #ef4444;
        }

        .dark-mode .pm-status.error {
            background: #7f1d1d;
            color: #fca5a5;
        }

        .pm-info {
            color: #9ca3af;
            font-size: 0.8rem;
            margin-top: 0.75rem;
            text-align: center;
        }

        @media (max-width: 768px) {
            .page-container {
                padding: 1rem;
            }

            .section-header h2 {
                font-size: 1.25rem;
            }

            .chat-messages {
                padding: 1rem;
                max-height: 300px;
            }

            .send-button {
                padding: 0.75rem 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="page-container">
        <a href="/Frontend/index.html" class="back-button">
            ← Back to Control
        </a>

        <!-- Public Chat Section -->
        <div class="section-header">
            <h2>💬 Public Chat</h2>
            <p>Chat anonymously — just type your name with each message</p>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="empty-state">Loading messages...</div>
        </div>

        <div class="chat-input-container">
            <input
                type="text"
                class="chat-input"
                id="nameInput"
                placeholder="Your name"
                maxlength="40"
                style="flex: 0 0 140px;"
            >
            <input
                type="text"
                class="chat-input"
                id="messageInput"
                placeholder="Type your message..."
                maxlength="500"
            >
            <button class="send-button" id="sendButton">Send</button>
        </div>
    </div>

    <script>
        let lastMessageCount = 0;

        // Restore the last-used display name for convenience.
        document.getElementById('nameInput').value = localStorage.getItem('chatName') || '';

        // ============== Public Chat ==============
        const CHAT_ACCESS_DENIED = 'Access denied: your network provider is not allowed to use this service.';

        /** Read a response defensively - it may be HTML (blocked page / proxy error). */
        async function readChatPayload(response) {
            const contentType = (response.headers.get('content-type') || '').toLowerCase();
            if (!contentType.includes('application/json')) {
                return { isJson: false, data: null };
            }
            try {
                return { isJson: true, data: await response.json() };
            } catch (err) {
                return { isJson: false, data: null };
            }
        }

        function describeChatFailure(response, payload) {
            if (payload.isJson && payload.data && typeof payload.data.detail === 'string') {
                return payload.data.detail;
            }
            if (response.status === 401 || response.status === 403 || !payload.isJson) {
                return CHAT_ACCESS_DENIED;
            }
            if (response.status >= 500) {
                return `The server is having trouble (error ${response.status}). Please try again shortly.`;
            }
            return `Request failed (error ${response.status}).`;
        }

        async function loadMessages() {
            const messagesContainer = document.getElementById('chatMessages');
            let response;
            try {
                response = await fetch('/api/chat/messages', {
                    credentials: 'include',
                    headers: {
                        'Accept': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest'
                    }
                });
            } catch (error) {
                console.error('Error loading messages:', error);
                messagesContainer.innerHTML = '<div class="empty-state">Cannot reach the server. Check your connection.</div>';
                return;
            }

            const payload = await readChatPayload(response);

            if (!response.ok || !payload.isJson) {
                const message = describeChatFailure(response, payload);
                console.error('Error loading messages:', message);
                messagesContainer.innerHTML = `<div class="empty-state">${escapeHtml(message)}</div>`;
                return;
            }

            try {
                const data = payload.data;

                if (data.messages.length === 0) {
                    messagesContainer.innerHTML = '<div class="empty-state">No messages yet. Be the first to say something!</div>';
                    return;
                }

                if (data.messages.length !== lastMessageCount) {
                    lastMessageCount = data.messages.length;

                    messagesContainer.innerHTML = data.messages.map(msg => {
                        const messageTime = new Date(msg.timestamp).toLocaleTimeString([], {
                            hour: '2-digit',
                            minute: '2-digit'
                        });

                        return `
                            <div class="message">
                                <div class="message-header">
                                    <span class="message-username">${escapeHtml(msg.name)}</span>
                                    <span class="message-time">${messageTime}</span>
                                </div>
                                <div class="message-text">${escapeHtml(msg.message)}</div>
                            </div>
                        `;
                    }).join('');

                    messagesContainer.scrollTop = messagesContainer.scrollHeight;
                }
            } catch (error) {
                console.error('Error loading messages:', error);
            }
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const nameField = document.getElementById('nameInput');
            const message = input.value.trim();
            const name = nameField.value.trim() || 'Anonymous';

            if (!message) return;

            localStorage.setItem('chatName', nameField.value.trim());

            const sendButton = document.getElementById('sendButton');
            sendButton.disabled = true;

            try {
                let response;
                try {
                    response = await fetch('/api/chat/send', {
                        method: 'POST',
                        credentials: 'include',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json',
                            'X-Requested-With': 'XMLHttpRequest'
                        },
                        body: JSON.stringify({ name, message })
                    });
                } catch (error) {
                    console.error('Error sending message:', error);
                    alert('Cannot reach the server. Please check your connection and try again.');
                    return;
                }

                const payload = await readChatPayload(response);

                if (!response.ok || !payload.isJson) {
                    const failure = describeChatFailure(response, payload);
                    console.error('Error sending message:', failure);
                    alert(failure);
                    return;
                }

                input.value = '';
                await loadMessages();
            } finally {
                sendButton.disabled = false;
                input.focus();
            }
        }

        // ============== Utilities ==============
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ============== Event Listeners ==============
        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
        document.getElementById('sendButton').addEventListener('click', sendMessage);

        // Load on page load
        loadMessages();
        setInterval(loadMessages, 3000);

        // Apply dark mode if set
        const isDarkMode = localStorage.getItem('dark-mode') === 'true';
        if (isDarkMode) {
            document.body.classList.add('dark-mode');
        }
    </script>
</body>
</html>
